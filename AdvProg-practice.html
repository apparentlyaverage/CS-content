<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Programming: Practice</title>
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1da;
  --accent:#2f5d8a;--accent-soft:#e6eef6;--good:#2e7d4f;--good-soft:#e5f3ea;--bad:#b3402f;--bad-soft:#f8e6e2;
  --code-bg:#f1efe8;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17181a;--panel:#212226;--ink:#ecebe6;--muted:#9a9993;--line:#34353a;
  --accent:#7fb0e0;--accent-soft:#25313d;--good:#6fcf97;--good-soft:#1f3328;--bad:#f08a78;--bad-soft:#3a2420;--code-bg:#1b1c1f;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-right:6px}
.q{font-size:17px;font-weight:550;margin:8px 0 12px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font:13.5px/1.5 var(--mono);margin:10px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 4px;border-radius:4px}
pre code{background:none;padding:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:10px 13px;cursor:pointer;font:inherit;display:flex;gap:10px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);min-width:18px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
input.ans{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:15px var(--mono)}
.fb{margin-top:12px;padding:11px 14px;border-radius:9px;font-size:15px}
.fb.ok{background:var(--good-soft);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.info{background:var(--accent-soft);border-left:4px solid var(--accent)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.progress>i{display:block;height:100%;background:var(--accent);width:0}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center;user-select:none}
.flash .front{font-size:20px;font-weight:600}
.flash .back{margin-top:16px;text-align:left;border-top:1px dashed var(--line);padding-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{font-size:22px;display:block}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.notes h3{margin:18px 0 6px;font-size:16px}
.notes ul{margin:4px 0 8px;padding-left:20px}
.notes li{margin:3px 0}
.kbd{font:12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.hidden{display:none}
</style>
</head>
<body>
<header><div class="bar">
  <div><h1>Advanced Programming: Practice</h1><div class="sub">Quiz, flashcards and cheat sheet for every chapter of the CS2 AdvProg notes</div></div>
  <nav class="tabs" id="tabs">
    <button data-v="quiz" class="on">Quiz</button>
    <button data-v="cards">Flashcards</button>
    <button data-v="notes">Cheat sheet</button>
    <button data-v="stats">Progress</button>
  </nav>
</div></header>
<main>
  <section class="card" id="filters">
    <div class="row" style="justify-content:space-between">
      <b>Topics</b>
      <span class="row"><button class="chip" id="allOn">All</button><button class="chip" id="allOff">None</button></span>
    </div>
    <div class="chips" id="topicChips" style="margin-top:8px"></div>
    <div class="row" style="margin-top:12px">
      <span class="meta">Mode:</span>
      <div class="chips" id="modeChips">
        <button class="chip on" data-m="all">Everything</button>
        <button class="chip" data-m="weak">Ones I got wrong</button>
        <button class="chip" data-m="new">Not seen yet</button>
      </div>
      <span class="meta" id="poolInfo" style="margin-left:auto"></span>
    </div>
  </section>

  <section id="v-quiz"></section>
  <section id="v-cards" class="hidden"></section>
  <section id="v-notes" class="hidden"></section>
  <section id="v-stats" class="hidden"></section>
</main>
<script>
const BANK_ID = "advprog";
const TOPICS = [
  { id: "quality", name: "1 · Program quality" },
  { id: "recint", name: "2 · Recursion & interfaces" },
  { id: "abstr", name: "3 · Abstraction & ADTs" },
  { id: "lists", name: "4 · Vectors & lists" },
  { id: "stackq", name: "5 · Stacks, queues, deques" },
  { id: "trees", name: "6 · Trees & graphs" },
  { id: "hash", name: "7 · Dictionaries & hashing" },
  { id: "bigo", name: "8 · Big-O" },
  { id: "search", name: "9 · Searching" },
  { id: "sort", name: "10 · Sorting" },
];
// M = multiple choice (a = index of correct option), I = typed answer (a = accepted answers), C = flashcard only
const M = (t, q, o, a, e, code) => ({ t, type: "mcq", q, o, a, e, code });
const I = (t, q, a, e, code) => ({ t, type: "input", q, a, e, code });
const C = (t, q, a, code) => ({ t, type: "card", q, a, code });

const QUESTIONS = [
// ---------------- Chapter 1 ----------------
M("quality", "Which program-quality criterion do the notes call the most important?", ["Efficiency", "Correctness", "Clarity", "Portability"], 1, "A program that doesn't work correctly is of no use whatsoever, so correctness comes first."),
M("quality", "For a **one-shot program** (used once, then discarded), which criterion has top priority?", ["Efficiency", "Generality", "Ease of coding", "Amenability to modification"], 2, "Writing time far exceeds usage time, so ease of coding wins. Generality, efficiency and modifiability don't matter."),
M("quality", "For **service routines and program components** (e.g. a sort routine or a square-root method), which criterion is critically important?", ["Efficiency", "Ease of use", "Ease of coding", "Portability"], 0, "Library routines are short and used many times, so efficiency is critical."),
M("quality", "Which two criteria do the notes say tend to be mutually exclusive, so a compromise is usually needed?", ["Correctness and clarity", "Generality and efficiency", "Portability and ease of use", "Clarity and ease of modification"], 1),
M("quality", "In Java, what does `x = a * b / c * d;` actually compute?", ["(a*b)/(c*d)", "((a*b)/c)*d", "a*(b/(c*d))", "a*b/(c*d) rounded"], 1, "* and / have equal precedence and associate left-to-right, so it's ((a·b)/c)·d. The correct code for ab/cd is `(a * b) / (c * d)`. Brackets are free, so use them."),
M("quality", "Which is **not** one of the common errors listed under Correctness?", ["Off-by-one errors", "Precedence errors", "Real (floating point) numbers not stored exactly", "Using too many interfaces"], 3, "The list: incomplete solution, initialisation, off-by-one, real numbers, typographical (1/I/l, 0/O), precedence."),
M("quality", "A **precondition** is…", ["What must hold true at the start of a method's execution", "What the method guarantees at the end", "A runtime check the JVM always does", "The method's return type"], 0, "The postcondition describes the state the method leaves the program in when it finishes."),
M("quality", "If calling code violates a method's precondition, what is guaranteed about the postcondition?", ["It still holds", "Nothing. The method may return garbage", "An AssertionError is always thrown", "The compiler rejects the call"], 1),
M("quality", "In a postcondition, what does `n<entry>` mean?", ["The value of parameter n on entry to the method", "The final value of n", "n is an input-only parameter", "n must be non-negative"], 0),
M("quality", "Since which Java version is the `assert` statement supported?", ["1.0", "1.2", "1.4", "5.0"], 2),
M("quality", "What does a failing `assert` statement throw?", ["AssertionException", "IllegalArgumentException", "AssertionError", "RuntimeException"], 2, "Strictly it's an error, not an exception: java.lang.AssertionError."),
M("quality", "By default, are Java assertions checked at runtime?", ["Yes, always", "No. Assertion checking is disabled by default and must be enabled at runtime", "Only in main()", "Only inside constructors"], 1, "This lets you check them during development and testing, then disable them for efficiency when you ship."),
M("quality", "In `assert ch != ' ' : \"Character is not a space\";` what is the part after the colon used for?", ["A boolean that must also be true", "The error message for the AssertionError", "A label for a break statement", "A default value"], 1, "The second form takes an expression of any type, converted to a string for the error message."),
M("quality", "According to Oracle's guidelines (quoted in the notes), how should a **public** method check its preconditions?", ["With assert statements", "By throwing exceptions (e.g. IllegalArgumentException)", "With comments only", "By returning -1"], 1),
M("quality", "Javadoc documentation comments begin with…", ["`//*`", "`/*`", "`/**`", "`#doc`"], 2),
I("quality", "Which Javadoc tag documents a method parameter? (type the tag, e.g. @something)", ["@param"]),
I("quality", "Which Javadoc tag documents what a method returns?", ["@return", "@returns"]),
M("quality", "Which of these is **not** one of the Javadoc tags used in the Roots example?", ["@author", "@version", "@throws", "@precondition"], 3),
M("quality", "Main quality benefit of Javadoc-style automated documentation?", ["Faster code", "Code and documentation are written together in one set of files, so they stay in agreement", "Removes the need for comments", "It checks preconditions"], 1),
M("quality", "These notes follow a **bottom-up** approach. What does that mean?", ["Study applications first, then implementation", "Study the implementation of a data structure first, then its use", "Start with sorting, end with lists", "Start with assembly language"], 1),
C("quality", "List the 8 program-quality criteria.", "Correctness, ease of use, generality, efficiency, portability, clarity, ease of coding and testing, amenability to modification."),
C("quality", "Suggested priority order for **production programs**", "Correctness → ease of use → clarity → portability → generality → ease of modification → ease of coding. (Efficiency is about level with clarity for editors/compilers.)"),
C("quality", "What is *literate programming*?", "Placing a program's code in the middle of a document that discusses and explains it. These notes embed code snippets in explanations; full listings are in Appendix A."),

// ---------------- Chapter 2 ----------------
M("recint", "Every correct recursive algorithm needs…", ["A loop", "A stop (base) case, with each call working on a simpler case", "A global variable", "An interface"], 1, "Without the stop case it never terminates."),
I("recint", "What does `factorial(4)` return, using the notes' method?", ["24"], "4 × 3 × 2 × 1 × 0! with 0! = 1.", `public int factorial(int n)
{ if (n == 0)
    return 1;                  // stop case
  else
    return n * factorial(n-1); // recursive call
}`),
M("recint", "The notes say the recursive factorial should be used in practice when…", ["n is small", "n is large", "Never. The iterative version is far more efficient", "Always, because it's elegant"], 2),
M("recint", "Why does `readAndWriteBackwards()` correctly print the input reversed?", ["It uses a StringBuffer", "Each recursive call has its own copy of the local variable ch", "It uses a class variable to store characters", "Java strings are immutable"], 1, "If ch were a class/instance variable, every call would share it and the program would break.", `public void readAndWriteBackwards()
{ char ch;
  ch = (char)System.in.read();
  if (ch != '\\n')
    readAndWriteBackwards();
  System.out.print(ch);
}`),
I("recint", "Fibonacci with f1 = f2 = 1. What is f7?", ["13"], "1, 1, 2, 3, 5, 8, 13"),
I("recint", "Towers of Hanoi: minimum number of moves to move 4 disks?", ["15"], "2ⁿ − 1 = 15. The problem is O(2ⁿ) and is the notes' example of an intractable problem."),
M("recint", "Recursive Towers of Hanoi: to move n disks from A to B, the first step is…", ["Move the largest disk to B", "Move n−1 disks from A to C using B as temporary", "Move n−1 disks from A to B", "Move 1 disk to C"], 1, "Then move disk n from A to B, then move n−1 disks from C to B using A as temporary. Steps 1 and 3 are recursive."),
M("recint", "Gene sequence exercise: how many full sequences can be generated from `ACXGX`?", ["2", "4", "8", "16"], 3, "Each X can be A, C, T or G: 4 × 4 = 16."),
M("recint", "Why can't Java model a PersonalAssistant as both a Manager and a Secretary through inheritance?", ["Java only allows single inheritance (one superclass)", "Manager is final", "Interfaces can't extend classes", "Secretary is abstract"], 0, "The solution is to extend Secretary and **implement** a ManagerialResponsibilities interface."),
M("recint", "What does a Java interface (as described in the notes) contain?", ["Data members and method bodies", "Method headings (followed by ;) that implementing classes must provide", "Only constructors", "A single abstract superclass"], 1),
M("recint", "Can a class both extend a class and implement several interfaces?", ["No", "Yes, e.g. `class MyClass extends SomeOtherClass implements IntA, IntB, IntC`", "Only if the interfaces are empty", "Only with generics"], 1),
M("recint", "Given `ManagerialResponsibilities mgr = new Director();` (Director extends Manager, which implements the interface), what can you call through `mgr`?", ["Any Director method", "Only the methods declared in the interface (manage)", "Nothing until it's cast", "Only Object methods"], 1, "Using an interface type means you lose access to class-specific features unless you test with instanceof and cast."),
M("recint", "Which operator checks the actual class of the object an interface reference refers to?", ["typeof", "instanceof", "getClass==", "is"], 1),
M("recint", "In the notes' class diagrams, dashed lines indicate…", ["Inheritance", "Implementing an interface (not class inheritance)", "Private members", "Aggregation"], 1),

// ---------------- Chapter 3 ----------------
M("abstr", "Formally, an abstract data type is…", ["A pair <V, O>: a set of values and a set of operations on them", "A class with only abstract methods", "An interface", "A record type"], 0),
M("abstr", "Which level is called the **conventional machine level** (the lowest level most programmers know about)?", ["Microcode", "Machine code", "Assembly language", "Operating system"], 1),
M("abstr", "Order these from lowest to highest abstraction: Assembly, Machine code, Microcode, Operating System.", ["Microcode → Machine code → OS → Assembly", "Machine code → Microcode → Assembly → OS", "Microcode → OS → Machine code → Assembly", "Machine code → Assembly → Microcode → OS"], 0, "Full hierarchy: Quantum physics → Electronic circuits → Microcode → Machine code → Operating system → Assembly → High level → 4GL → 5GL."),
M("abstr", "Assembly languages are referred to as…", ["First generation", "Second generation", "Third generation", "Fourth generation"], 1, "1GL = machine code, 2GL = assembly, 3GL = high-level (Java, C#, Python…), 4GL = business/database, 5GL = AI techniques."),
M("abstr", "Which was the first third-generation (high level) language?", ["COBOL", "FORTRAN", "C", "Pascal"], 1, "Developed by IBM in the 1950s."),
M("abstr", "The program that translates assembly language into machine code is called…", ["A compiler", "An interpreter", "An assembler", "A linker"], 2),
M("abstr", "A feature that distinguishes high-level languages from earlier generations:", ["They run faster", "They are far more machine independent", "They have one-to-one correspondence with machine code", "They need no translation"], 1),
M("abstr", "Using a method like `writeObject` without knowing how the object is converted and written is an example of…", ["Procedural abstraction", "Data abstraction", "Inheritance", "Polymorphism"], 0),
M("abstr", "Which two Java class features make the class a truly powerful ADT mechanism (beyond a simple record)?", ["Inheritance and static methods", "Visibility control (public/private) and methods for the operations", "Generics and arrays", "Constructors and finalizers"], 1),
M("abstr", "Information hiding gives two views of an ADT. They are…", ["Static and dynamic", "Client (user) view and implementor view", "Public and protected", "Compile-time and run-time"], 1),
M("abstr", "In the notes' simplified class diagrams, members shown with a grey background are…", ["Public", "Private", "Static", "Abstract"], 1),
C("abstr", "Mary Shaw on abstraction (the gist)", "Software problems come from complexity and our human limits in handling it. We deal with complexity by abstracting: ignoring inessential details and working with a generalised model, the object's \"essence\"."),
C("abstr", "Describe the Java `int` type as an ADT <V, O>.", "V = { −2 147 483 648 … 2 147 483 647 }\nO = { +, −, *, /, %, ~, |, &, ^, <<, >>, >>>, <, <=, ==, >=, >, !=, = }"),

// ---------------- Chapter 4 ----------------
M("lists", "What is the main problem with plain Java arrays that IntegerVector starts to address?", ["They can't hold ints", "Their size is fixed when created", "They're slow to index", "They can't be passed to methods"], 1),
I("lists", "What is the default initial size of an IntegerVector created with `new IntegerVector()`?", ["100"], "`this(100);` calls the other constructor."),
I("lists", "After these calls, what does v1 contain? Give values in order, separated by spaces.", ["3 21 -8 -7"], "add(21, 1) inserts at position 1, shifting -8 up. add(-7, 92) has position ≥ numElements, so it just appends.", `IntegerVector v1 = new IntegerVector();
v1.add(3);
v1.add(-8);
v1.add(21, 1);
v1.add(-7, 92);`),
M("lists", "What does `data[numElements++] = item;` do?", ["Increments numElements, then stores item at the new index", "Stores item at index numElements, then increments numElements", "Stores item at numElements+1", "Compile error"], 1, "Postfix ++ uses the old value as the index, then increments."),
M("lists", "In `add(int item, int position)` for IntegerVector, how is space made for the new item?", ["A new array is allocated", "Elements from numElements−1 down to position are moved up one place", "Elements are moved down one place", "The last element is deleted"], 1, `for (k = numElements - 1; k >= position; k--)
  data[k + 1] = data[k];
data[position] = item;
numElements++;`),
M("lists", "What does IntegerVector's `position(item)` return if the item is not found?", ["0", "-1", "numElements", "It throws an exception"], 1),
M("lists", "Why does toString() use a StringBuffer?", ["Strings can't be returned", "String objects are immutable, so building one piece by piece creates many new objects; StringBuffer can be changed freely", "StringBuffer is thread-safe", "It's required by the Object class"], 1),
M("lists", "Why is a `toString()` method better than an `output()` method that prints to System.out?", ["It's faster", "It works with any output stream or GUI text box, not just System.out", "It doesn't need a loop", "It is called by the garbage collector"], 1),
M("lists", "get/set methods are generally called…", ["Mutators", "Accessor methods", "Iterators", "Constructors"], 1),
M("lists", "Exercise 4.2 deleteAll for IntegerVector: the easy way is…", ["Loop and remove each element", "Set numElements = 0", "Create a new array", "Set data = null"], 1),
M("lists", "In IntegerList, `ListNode` is declared as a private inner class with public fields. Why is it OK for its fields to be public?", ["Inner classes can't have private fields", "Because ListNode itself is private, its members are only visible inside IntegerList", "Public fields are faster", "It isn't OK, it's a bug"], 1, "One of the rare occasions where public data members are acceptable."),
M("lists", "Why is adding at the beginning of a linked list the simplest case?", ["No need to search for the position: just link the new node to first and update first", "The list is always sorted", "No new node is needed", "It doesn't change numElements"], 0),
M("lists", "Correct order of steps to add `node` at the front of a linked list?", ["first = node; node.next = first;", "node.next = first; first = node;", "node = first; first.next = node;", "first.next = node; node.next = null;"], 1, "If you set first = node first, you lose the old list."),
M("lists", "In the linked-list `add(item, position)`, why does the for loop test both `k < position` and `curr != null`?", ["To support negative positions", "So it doesn't run off the end when position is bigger than the list (then it adds at the end)", "To skip the header node", "To handle duplicates"], 1),
M("lists", "Efficiency: which statement about IntegerVector vs IntegerList is right?", ["get/set are O(1) for both", "get/set are fast for the array but need a loop for the linked list; inserting in the middle is cheap for the linked list but needs data moves for the array", "Linked lists are faster for everything", "Arrays are faster for everything"], 1),
M("lists", "What is the common Java idiom for walking a linked list?", ["`for (ListNode curr = first; curr != null; curr = curr.next)`", "`while (first.next)`", "`for (int k = 0; k < list.length; k++)`", "`do { curr++; } while (curr)`"], 0),
M("lists", "In `for (k = 0, curr = first; curr != null && curr.data != item; k++, curr = curr.next) ;` why is the test safe when curr is null?", ["Java auto-initialises curr", "Short-circuit evaluation: if curr != null is false, curr.data is never evaluated", "NullPointerException is caught", "The loop body is empty"], 1),
M("lists", "Why do linked-list add/remove need a special case (the `if (prev != null)` test)?", ["For adding/removing at the start of the list, where `first` itself must change", "For the end of the list", "For duplicate values", "For empty strings"], 0),
M("lists", "Why are the client interfaces of IntegerVector and IntegerList almost identical?", ["Coincidence", "To hide implementation details: clients can switch implementations with almost no change (just the class name)", "Java requires it", "Both extend the same class"], 1),
M("lists", "Exercise 4.19: how can adding to the end of a linked list be simplified?", ["Use an array", "Keep a reference to the last node (e.g. `last`)", "Use a doubly-linked list only", "Sort the list"], 1),
M("lists", "In ObjectList, what changed in `position()` compared with IntegerList?", ["It uses `.equals` instead of `==`", "It returns an Object", "It uses recursion", "Nothing"], 0),
M("lists", "What is **autoboxing**?", ["Automatic conversion of a primitive to an object of its wrapper class (e.g. int → Integer)", "Automatic garbage collection", "Type erasure", "Packing objects into arrays"], 0, "The Integer objects are still created; the compiler just does it for you."),
M("lists", "With ObjectList, `Student s = list.get(0);` gives…", ["A compile error, because get returns Object; you need a cast `(Student)list.get(0)`", "A runtime error", "It works fine", "A warning only"], 0),
M("lists", "Which is pattern matching for instanceof (newer Java)?", ["`if (obj instanceof Student s) { … s … }`", "`if (obj is Student)`", "`switch(obj) case Student:`", "`Student s = obj as Student;`"], 0, "Combines the test, cast and assignment in one step. Simpler and safer."),
M("lists", "Main drawback of polymorphism-based ObjectList compared with GenericList<T>?", ["It's slower", "No compile-time type checking, and casts are needed", "It can't hold Strings", "It uses more memory"], 1),
M("lists", "What is the `<>` in `GenericList<Student> l = new GenericList<>();` called?", ["The diamond", "The wildcard", "The bound", "Raw type"], 0, "Allowed since Java 7. The compiler infers the type."),
M("lists", "What happens with `GenericList<Student> l = new GenericList();` (no diamond)?", ["Same as with diamond", "A 'raw' object is created without the type checking, and the compiler warns", "Compile error", "Runtime error"], 1),
M("lists", "Which java.util classes match the ADTs from this chapter?", ["LinkedList (like GenericList), Vector/ArrayList (array-based)", "HashMap and TreeMap", "Stack and Queue", "Arrays and Collections"], 0),

const NOTES = `
<h2 style="margin-top:0">Advanced Programming: one-page cheat sheet</h2>
<h3>1 · Program quality</h3>
<ul><li>Criteria: correctness, ease of use, generality, efficiency, portability, clarity, ease of coding/testing, ease of modification.</li>
<li>One-shot → ease of coding first. Production → correctness, ease of use, clarity… Service routines → efficiency critical.</li>
<li>Pre/postconditions as comments. <code>assert cond;</code> / <code>assert cond : msg;</code> throws <code>AssertionError</code>. Off by default (enable at runtime). Public methods: throw exceptions for preconditions.</li>
<li>Javadoc: <code>/** … */</code>, <code>@author @version @param @return @throws</code>.</li></ul>
<h3>2 · Recursion & interfaces</h3>
<ul><li>Recursion = simpler version of the same problem + a stop case. Each call gets its own locals.</li>
<li>Hanoi: move n−1 A→C, move disk n A→B, move n−1 C→B. 2ⁿ−1 moves.</li>
<li>Java has single inheritance. Interfaces give shared behaviour; an interface-typed variable only sees the interface methods (use instanceof + cast).</li></ul>
<h3>3 · Abstraction</h3>
<ul><li>Levels: quantum → circuits → microcode → machine code (1GL, conventional machine level) → OS → assembly (2GL) → HLL (3GL; FORTRAN first) → 4GL → 5GL.</li>
<li>ADT = &lt;V, O&gt;. Procedural vs data abstraction. Client vs implementor view.</li></ul>
<h3>4 · Vectors & lists</h3>
<ul><li>IntegerVector: <code>data[]</code> + <code>numElements</code>; default size 100; get/set O(1); insert/remove shift elements.</li>
<li>IntegerList: private inner <code>ListNode{data,next}</code>, <code>first</code>; get/set walk the list (O(n)); special case when changing the first node.</li>
<li>ObjectList (polymorphism: casts, no compile-time checks, uses <code>.equals</code>) vs <code>GenericList&lt;T&gt;</code> (compile-time checks, no casts). Diamond <code>&lt;&gt;</code>; raw types give a warning.</li></ul>
<h3>5 · Stacks, queues, deques</h3>
<ul><li>Stack LIFO: push/pop/top/isEmpty. Array: topIndex −1 when empty, <code>data[++top]=x</code>, <code>return data[top--]</code>. Linked: <code>node.next=top; top=node;</code></li>
<li>Queue FIFO: add/remove/head/isEmpty. Travelling queue problem → circular queue <code>tl=(tl+1)%len</code>; full when tl catches hd; hd=tl=−1 when empty.</li>
<li>Maze: queue = breadth-first (shortest path); stack = depth-first. beenThere matrix.</li>
<li>Deque: addLeft/addRight/removeLeft/removeRight; doubly + circularly linked with a header node; empty when <code>header.rt == header</code>.</li></ul>
<h3>6 · Trees & graphs</h3>
<ul><li>Terms: root, leaf, parent/child, siblings, depth, outdegree, indegree (0 root / 1 others). Proper binary tree: 0 or 2 children.</li>
<li>General → binary: left = left-most child, right = right sibling.</li>
<li>Traversals: LNR in-order, NLR pre-order, LRN post-order, breadth (queue).</li>
<li>BST: left &lt; node ≤ right; insert as a leaf; delete with 2 children → replace with min of right subtree (deleteMin). <code>&lt;T extends Comparable&gt;</code>. Iterator: get/next/atEnd.</li>
<li>Graph G=(V,E); directed/weighted; adjacency matrix (diagonal 1s, symmetric if undirected) vs edge lists (sparse graphs).</li></ul>
<h3>7 · Hashing</h3>
<ul><li>Dictionary: unique keys. ListDictionary is sorted; <code>get</code> creates a missing entry.</li>
<li>hash: <code>h = h*26 + ch</code>; <code>(h &amp; 0x7FFFFFFF) % SIZE</code>. Collisions; perfect (minimal) hashing for limited domains only.</li>
<li>Internal/open addressing with linear probing; states empty/occupied/deleted; search stops only at empty; primary vs secondary clustering; keep one slot empty; default size 101.</li>
<li>External: buckets of linked lists; insert at the front of the bucket; unlimited size.</li></ul>
<h3>8 · Big-O</h3>
<ul><li>t ≤ c·f(n) for n &gt; n₀. 1 &lt; log n &lt; n &lt; n log n &lt; n² &lt; nᵐ &lt; 2ⁿ &lt; n!. Tractable = polynomial or better.</li>
<li>Million-times faster machine: O(n) → 10⁶n, O(n²) → 1000n, O(2ⁿ) → n+20.</li>
<li>Σ i = n(n+1)/2 → O(n²). Sequential search: n/2 found, 3n/4 if found half the time.</li></ul>
<h3>9 · Searching</h3>
<ul><li>Sorted sequential: n/2. Binary: look=(left+right)/2, C_n = log₂n + 1 → O(log n); 10 items → 4, 10⁶ → 20. Overflow bug: use left+(right−left)/2.</li>
<li>Interpolated: O(log log n) for even keys (≈3 comparisons for 1000 items).</li></ul>
<h3>10 · Sorting</h3>
<table><tr><th>Sort</th><th>Best</th><th>Average</th><th>Worst</th><th>Note</th></tr>
<tr><td>Bubble</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>madeSwap flag; items move 1 place per step</td></tr>
<tr><td>Insertion</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>good for linked lists / data being read in</td></tr>
<tr><td>Selection</td><td>O(n²)</td><td>O(n²)</td><td>O(n²)</td><td>only n−1 swaps</td></tr>

// ---------- state ----------
const LS = "practice:" + BANK_ID;
let store = {};
try { store = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { store = {}; }
store.hist = store.hist || {};      // qid -> {right, wrong, last}
store.topics = store.topics || TOPICS.map(t => t.id);
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };
let mode = "all";

QUESTIONS.forEach((q, i) => { q.id = q.id || (q.t + ":" + i); });

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// minimal markup: `code`, **bold**, and ```block```
function md(s) {
  if (s == null) return "";
  const parts = String(s).split("```");
  return parts.map((p, i) => {
    if (i % 2) return "<pre><code>" + esc(p.replace(/^\n/, "")) + "</code></pre>";
    return esc(p).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  }).join("");
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// commas/semicolons/whitespace all count as one separator; then a second, space-free form for loose matching
const norm = s => String(s).toLowerCase().replace(/[−–]/g, "-").replace(/[\s,;]+/g, " ").trim();
const squash = s => norm(s).replace(/\s+/g, "").replace(/^\$/, "");

function pool() {
  return QUESTIONS.filter(q => store.topics.includes(q.t)).filter(q => {
    const h = store.hist[q.id];
    if (mode === "weak") return h && h.wrong > 0 && (h.lastOk !== true);
    if (mode === "new") return !h;
    return true;
  });
}

// ---------- filters ----------
const chipsEl = document.getElementById("topicChips");
function renderChips() {
  chipsEl.innerHTML = TOPICS.map(t => {
    const n = QUESTIONS.filter(q => q.t === t.id).length;
    return `<button class="chip ${store.topics.includes(t.id) ? "on" : ""}" data-t="${t.id}">${esc(t.name)} <span class="meta">${n}</span></button>`;
  }).join("");
  document.getElementById("poolInfo").textContent = pool().length + " questions in pool";
}
chipsEl.onclick = e => {
  const b = e.target.closest("[data-t]"); if (!b) return;
  const id = b.dataset.t;
  store.topics = store.topics.includes(id) ? store.topics.filter(x => x !== id) : store.topics.concat(id);
  save(); renderChips(); restart();
};
document.getElementById("allOn").onclick = () => { store.topics = TOPICS.map(t => t.id); save(); renderChips(); restart(); };
document.getElementById("allOff").onclick = () => { store.topics = []; save(); renderChips(); restart(); };
document.getElementById("modeChips").onclick = e => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  mode = b.dataset.m;
  document.querySelectorAll("#modeChips .chip").forEach(c => c.classList.toggle("on", c === b));
  renderChips(); restart();
};

// ---------- tabs ----------
let view = "quiz";
document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));

// ---------- quiz ----------
let deck = [], idx = 0, score = 0, answered = false;
const qEl = document.getElementById("v-quiz");
function restart() {
  deck = shuffle(pool().filter(q => q.type !== "card"));
  idx = 0; score = 0; answered = false;
  cardDeck = shuffle(pool()); cardIdx = 0;
  renderQ(); if (view === "cards") renderCard();
}
function record(q, ok) {
  const h = store.hist[q.id] || { right: 0, wrong: 0 };
  ok ? h.right++ : h.wrong++;
  h.lastOk = ok; h.last = Date.now();
  store.hist[q.id] = h; save();
}
function topicName(id) { const t = TOPICS.find(t => t.id === id); return t ? t.name : id; }

function renderQ() {
  if (!deck.length) {
    qEl.innerHTML = `<div class="card"><p>No questions match. Pick some topics above${mode !== "all" ? ", or switch Mode back to <b>Everything</b>" : ""}.</p></div>`;
    return;
  }
  if (idx >= deck.length) {
    const pct = Math.round(100 * score / deck.length);
    qEl.innerHTML = `<div class="card"><h2 style="margin-top:0">Round done: ${score} / ${deck.length} (${pct}%)</h2>
      <p class="meta">Wrong answers are saved. Switch Mode to “Ones I got wrong” to drill just those.</p>
      <div class="row"><button class="btn" id="again">New round</button></div></div>`;
    document.getElementById("again").onclick = restart;
    return;
  }
  const q = deck[idx]; answered = false;
  let body = "";
  if (q.type === "input") {
    body = `<input class="ans" id="ans" autocomplete="off" spellcheck="false" placeholder="Type your answer, then Enter">
      <div class="row" style="margin-top:10px"><button class="btn" id="check">Check</button><button class="btn ghost" id="reveal">Show answer</button></div>`;
  } else {
    const opts = q.noShuffle ? q.o.map((t, i) => [t, i]) : shuffle(q.o.map((t, i) => [t, i]));
    body = `<div class="opts">${opts.map(([t, i], k) => `<button class="opt" data-i="${i}"><span class="k">${"ABCDEFG"[k]}</span><span>${md(t)}</span></button>`).join("")}</div>`;
  }
  qEl.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><span><span class="tag">${esc(topicName(q.t))}</span><span class="tag">${q.type === "input" ? "type answer" : "multiple choice"}</span></span>
    <span class="meta">Q ${idx + 1} / ${deck.length} · score ${score}</span></div>
    <div class="progress"><i style="width:${100 * idx / deck.length}%"></i></div>
    <div class="q">${md(q.q)}</div>${q.code ? `<pre><code>${esc(q.code)}</code></pre>` : ""}
    ${body}<div id="fb"></div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><span class="meta">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> pick · <span class="kbd">Enter</span> next</span>
    <button class="btn hidden" id="next">Next →</button></div></div>`;
  if (q.type === "input") {
    const inp = document.getElementById("ans"); inp.focus();
    const check = () => {
      if (answered) return;
      const val = norm(inp.value); if (!val) return;
      const accepted = (Array.isArray(q.a) ? q.a : [q.a]);
      const ok = accepted.some(a => norm(a) === val || squash(a) === squash(val));
      finish(q, ok, true);
    };
    document.getElementById("check").onclick = check;
    document.getElementById("reveal").onclick = () => { if (!answered) finish(q, false, true); };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.stopPropagation(); answered ? next() : check(); } });
  } else {
    qEl.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (answered) return;
      const ok = +b.dataset.i === q.a;
      qEl.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      finish(q, ok, false);
    });
  }
  document.getElementById("next").onclick = next;
}
function finish(q, ok, isInput) {
  answered = true; if (ok) score++; record(q, ok);
  const ansTxt = isInput ? `<div style="margin-top:4px">Answer: <code>${esc(Array.isArray(q.a) ? q.a[0] : q.a)}</code></div>` : "";
  document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><b>${ok ? "Correct." : "Not quite."}</b>${ansTxt}${q.e ? `<div style="margin-top:6px">${md(q.e)}</div>` : ""}</div>`;
  if (isInput && !ok && q.a) {
    document.getElementById("fb").insertAdjacentHTML("beforeend", `<div class="row" style="margin-top:8px"><button class="btn ghost" id="override">I had it right (count as correct)</button></div>`);
    document.getElementById("override").onclick = () => {
      const h = store.hist[q.id]; h.wrong--; h.right++; h.lastOk = true; save(); score++;
      document.getElementById("override").remove();
      document.querySelector("#fb .fb").className = "fb ok";
    };
  }
  document.getElementById("next").classList.remove("hidden");
}
function next() { if (!answered) return; idx++; renderQ(); window.scrollTo({ top: 0 }); }
document.addEventListener("keydown", e => {
  if (view !== "quiz") return;
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Enter" && answered) { next(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 7) { const b = qEl.querySelectorAll(".opt")[n - 1]; if (b && !answered) b.click(); }
});

function cardFace(q) {
  if (q.type === "card") return { f: q.q, b: q.a, code: q.code };
  if (q.type === "input") return { f: q.q, b: "`" + (Array.isArray(q.a) ? q.a[0] : q.a) + "`" + (q.e ? "\n\n" + q.e : ""), code: q.code };
  return { f: q.q, b: "**" + q.o[q.a] + "**" + (q.e ? "\n\n" + q.e : ""), code: q.code };
}
function renderCard() {
  if (!cardDeck.length) { cEl.innerHTML = `<div class="card"><p>No cards match the selected topics.</p></div>`; return; }
  if (cardIdx >= cardDeck.length) { cardDeck = shuffle(cardDeck); cardIdx = 0; }
  const q = cardDeck[cardIdx], c = cardFace(q); flipped = false;
  cEl.innerHTML = `<div class="card flash" id="flash">
      <div class="meta">${esc(topicName(q.t))} · card ${cardIdx + 1} / ${cardDeck.length}</div>
      <div class="front" style="margin-top:10px">${md(c.f)}</div>${c.code ? `<pre style="text-align:left"><code>${esc(c.code)}</code></pre>` : ""}
      <div class="back hidden" id="back">${md(c.b)}</div>
      <div class="meta" id="tapHint" style="margin-top:14px">Click or press <span class="kbd">Space</span> to flip</div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="cPrev">← Prev</button>
      <button class="btn ghost" id="cMiss" style="border-color:var(--bad);color:var(--bad)">Didn't know</button>
      <button class="btn ghost" id="cGot" style="border-color:var(--good);color:var(--good)">Knew it</button>
      <button class="btn ghost" id="cNext">Next →</button>
    </div>`;
  document.getElementById("flash").onclick = flip;
  document.getElementById("cPrev").onclick = () => { cardIdx = Math.max(0, cardIdx - 1); renderCard(); };
  document.getElementById("cNext").onclick = () => { cardIdx++; renderCard(); };
  document.getElementById("cGot").onclick = () => { record(q, true); cardIdx++; renderCard(); };
  document.getElementById("cMiss").onclick = () => { record(q, false); cardIdx++; renderCard(); };
}
function flip() { flipped = !flipped; document.getElementById("back").classList.toggle("hidden", !flipped); document.getElementById("tapHint").classList.toggle("hidden", flipped); }
document.addEventListener("keydown", e => {
  if (view !== "cards") return;
  if (e.key === " ") { e.preventDefault(); flip(); }
  if (e.key === "ArrowRight") { cardIdx++; renderCard(); }
  if (e.key === "ArrowLeft") { cardIdx = Math.max(0, cardIdx - 1); renderCard(); }
});

// ---------- notes ----------
document.getElementById("v-notes").innerHTML = `<div class="card notes">${NOTES}</div>`;

// ---------- stats ----------
function renderStats() {
  const rows = TOPICS.map(t => {
    const qs = QUESTIONS.filter(q => q.t === t.id);
    let seen = 0, r = 0, w = 0, mastered = 0;
    qs.forEach(q => { const h = store.hist[q.id]; if (h) { seen++; r += h.right; w += h.wrong; if (h.lastOk) mastered++; } });
    const acc = r + w ? Math.round(100 * r / (r + w)) : null;
    return { t, n: qs.length, seen, acc, mastered };
  });
  const tot = rows.reduce((a, x) => ({ n: a.n + x.n, seen: a.seen + x.seen, m: a.m + x.mastered }), { n: 0, seen: 0, m: 0 });
  document.getElementById("v-stats").innerHTML = `<div class="card">
    <div class="grid">
      <div class="stat"><span class="meta">Questions seen</span><b>${tot.seen} / ${tot.n}</b></div>
      <div class="stat"><span class="meta">Last answer correct</span><b>${tot.m}</b></div>
      <div class="stat"><span class="meta">Still to fix</span><b>${tot.seen - tot.m}</b></div>
    </div>
    <table style="margin-top:16px"><tr><th>Topic</th><th>Seen</th><th>Accuracy</th><th>Mastered</th></tr>
    ${rows.map(x => `<tr><td>${esc(x.t.name)}</td><td>${x.seen}/${x.n}</td><td>${x.acc == null ? "–" : x.acc + "%"}</td>
      <td><div class="progress" style="width:140px"><i style="width:${100 * x.mastered / x.n}%"></i></div></td></tr>`).join("")}
    </table>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="reset">Reset progress</button></div></div>`;
  document.getElementById("reset").onclick = () => { if (confirm("Clear all saved progress for this page?")) { store.hist = {}; save(); renderStats(); renderChips(); } };
}

renderChips(); restart();
</script>
