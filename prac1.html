<!DOCTYPE html>
<html>
<head>
    <title>Exercise 1 - Numeric Data</title>
</head>
<body>
    <h1>Exercise 1</h1>
    
    <!-- Your JavaScript runs inside the script tags -->
    <script>
        // Storing two numbers as instructed
        let num1 = 34.67;
        let num2 = 5.76;
        
        let sum = num1 + num2;
        let difference = num1 - num2;
        let product = num1 * num2;

        // Displaying the output on the web page
        document.write("<p>Sum = " + sum + "</p>");
        document.write("<p>Difference = " + difference + "</p>");
        document.write("<p>Product = " + product + "</p>");
    </script>
</body>
</html>
