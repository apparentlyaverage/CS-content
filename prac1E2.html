<!DOCTYPE html>
<html>
<head>
    <title>Exercise 2 - Time Conversion</title>
</head>
<body>
    <script>
        // Store the number of seconds
        let totalSeconds = 36548;

        // Calculate hours, minutes, and remaining seconds using division and remainders
        let hours = Math.floor(totalSeconds / 3600);
        let minutes = Math.floor((totalSeconds % 3600) / 60);
        let seconds = totalSeconds % 60;

        // Display output matching Figure 2, using toFixed() as hinted in the practical instructions
        document.write("<h2>H:" + hours.toFixed(0) + " M:" + minutes.toFixed(0) + " S:" + seconds.toFixed(0) + "</h2>");
    </script>
</body>
</html>
