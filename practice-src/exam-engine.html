<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS201 Exam Prep: code drills, past papers, predicted questions</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1da;--accent:#2f5d8a;--accent-soft:#e6eef6;
--good:#2e7d4f;--good-soft:#e5f3ea;--bad:#b3402f;--bad-soft:#f8e6e2;--warn:#9a6a00;--warn-soft:#fbf1d9;--code-bg:#f1efe8;
--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#212226;--ink:#ecebe6;--muted:#9a9993;--line:#34353a;--accent:#7fb0e0;
--accent-soft:#25313d;--good:#6fcf97;--good-soft:#1f3328;--bad:#f08a78;--bad-soft:#3a2420;--warn:#e7c46a;--warn-soft:#3a3220;--code-bg:#1b1c1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button,.btn,.chip{font:inherit}
nav.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1240px;margin:0 auto;padding:16px 18px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.side input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;margin-bottom:8px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 4px 4px}
.item{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:5px 8px;border-radius:7px;cursor:pointer;font:inherit;font-size:14px}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--accent);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;background:var(--line)}
.dot.ok{background:var(--good)} .dot.meh{background:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.good{border-color:var(--good);color:var(--good);background:transparent}
.btn.bad{border-color:var(--bad);color:var(--bad);background:transparent}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-right:6px}
h2{font-size:19px;margin:0 0 6px}
h3{font-size:16px;margin:14px 0 6px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow:auto;font:13px/1.5 var(--mono);margin:8px 0;tab-size:4}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 4px;border-radius:4px}
pre code{background:none;padding:0}
textarea{width:100%;min-height:220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:13px/1.5 var(--mono);tab-size:4;resize:vertical}
textarea.short{min-height:110px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.gap{font:13px/1.5 var(--mono);white-space:pre;overflow:auto;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gap .ln{display:flex;align-items:center;min-height:22px}
.gap input{flex:1;font:13px var(--mono);padding:2px 6px;border:1px dashed var(--accent);border-radius:5px;background:var(--panel);color:var(--ink);min-width:200px}
.gap input.ok{border:1px solid var(--good);background:var(--good-soft)}
.gap input.no{border:1px solid var(--bad);background:var(--bad-soft)}
.fb{margin-top:10px;padding:10px 13px;border-radius:9px}
.fb.ok{background:var(--good-soft);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.info{background:var(--accent-soft);border-left:4px solid var(--accent)}
.ans{background:var(--good-soft);border-left:4px solid var(--good);border-radius:9px;padding:10px 14px;margin-top:10px}
.q .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.marks{white-space:nowrap;font-weight:600;color:var(--accent)}
.score{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.sec{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.timer{font:600 15px var(--mono)}
.hidden{display:none}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 12px;border-radius:8px;font-size:14px;margin:8px 0}
</style>
</head>
<body>
<header><div class="bar">
  <div><h1>CS201 Exam Prep</h1><div class="sub">Every algorithm from AdvProg + MIPS2C as code drills · 2022 &amp; 2023 papers · predicted questions</div></div>
  <nav class="tabs" id="tabs">
    <button data-v="drills" class="on">Code drills</button>
    <button data-v="papers">Past papers</button>
    <button data-v="predict">Predicted questions</button>
    <button data-v="about">How to use</button>
  </nav>
</div></header>
<main>
  <section id="v-drills"></section>
  <section id="v-papers" class="hidden"></section>
  <section id="v-predict" class="hidden"></section>
  <section id="v-about" class="hidden"></section>
</main>
<script>
/*DATA*/

// ---------- utilities ----------
const LS = "practice:cs201-exam";
let store = {}; try { store = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) {}
store.drill = store.drill || {}; store.marks = store.marks || {}; store.ans = store.ans || {};
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(s) {
  if (s == null) return "";
  return String(s).split("```").map((p, i) => i % 2
    ? "<pre><code>" + esc(p.replace(/^\n/, "")) + "</code></pre>"
    : esc(p).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>")).join("");
}
const squash = s => s.replace(/\/\/.*$|#.*$/g, "").replace(/\s+/g, "").replace(/;$/, "");

// ---------- tabs ----------
document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["drills", "papers", "predict", "about"].forEach(v => document.getElementById("v-" + v).classList.toggle("hidden", v !== b.dataset.v));
  window.scrollTo({ top: 0 });
};

// ---------- code drills ----------
let cur = 0, filter = "", mode = "write";
const dEl = document.getElementById("v-drills");
dEl.innerHTML = `<div class="layout"><aside class="side"><input id="dsearch" placeholder="Search algorithms…">
  <div class="row" style="margin-bottom:4px"><button class="chip on" data-b="all">All</button><button class="chip" data-b="AdvProg">AdvProg</button><button class="chip" data-b="MIPS">MIPS</button><button class="chip" data-b="C">C</button></div>
  <div id="dlist"></div><div class="meta" id="dcount" style="margin:10px 4px"></div></aside><div id="dmain"></div></div>`;
let book = "all";
document.getElementById("dsearch").oninput = e => { filter = e.target.value.toLowerCase(); renderList(); };
dEl.querySelector(".side .row").onclick = e => { const b = e.target.closest("[data-b]"); if (!b) return; book = b.dataset.b; dEl.querySelectorAll("[data-b]").forEach(x => x.classList.toggle("on", x === b)); renderList(); };
function visible() { return DRILLS.map((d, i) => [d, i]).filter(([d]) => (book === "all" || d.book === book) && (!filter || (d.title + d.group + d.task).toLowerCase().includes(filter))); }
function renderList() {
  let html = "", g = null;
  visible().forEach(([d, i]) => {
    if (d.group !== g) { g = d.group; html += `<div class="grp">${esc(g)}</div>`; }
    const st = store.drill[i];
    html += `<button class="item ${i === cur ? "on" : ""}" data-i="${i}"><span>${esc(d.title)}</span><span class="dot ${st === 2 ? "ok" : st === 1 ? "meh" : ""}"></span></button>`;
  });
  document.getElementById("dlist").innerHTML = html || `<div class="meta">No matches.</div>`;
  const done = Object.values(store.drill).filter(v => v === 2).length;
  document.getElementById("dcount").textContent = `${DRILLS.length} drills · ${done} marked “nailed it”`;
}
document.getElementById("dlist").onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; cur = +b.dataset.i; renderList(); renderDrill(); window.scrollTo({ top: 0 }); };
function pickGaps(lines) {
  const cand = lines.map((l, i) => [l, i]).filter(([l]) => { const t = l.trim(); return t.length > 3 && !/^(\/\/|#|\/\*|\*|\}|\{|else$|[})\]]+;?$|\.text|\.data)/.test(t); });
  const n = Math.max(2, Math.round(cand.length * 0.35));
  const pick = new Set(); const arr = cand.slice();
  while (pick.size < Math.min(n, arr.length)) pick.add(arr[Math.floor(Math.random() * arr.length)][1]);
  return pick;
}
function renderDrill() {
  const d = DRILLS[cur]; if (!d) return;
  const lines = d.code.replace(/^\n/, "").replace(/\s+$/, "").split("\n");
  const m = document.getElementById("dmain");
  m.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><span><span class="tag">${esc(d.book)}</span><span class="tag">${esc(d.group)}</span>${d.exam ? `<span class="tag" style="color:var(--bad);border-color:var(--bad)">came up in ${esc(d.exam)}</span>` : ""}</span>
    <span class="row"><button class="btn ghost" id="prev">←</button><button class="btn ghost" id="nxt">→</button></span></div>
    <h2 style="margin-top:8px">${esc(d.title)}</h2>
    <div>${md(d.task)}</div>
    ${d.given ? `<h3>Given / starting point</h3><pre><code>${esc(d.given)}</code></pre>` : ""}
    <div class="row" style="margin-top:12px">
      <button class="chip ${mode === "write" ? "on" : ""}" data-m="write">✍️ Write from memory</button>
      <button class="chip ${mode === "gaps" ? "on" : ""}" data-m="gaps">🧩 Fill the gaps</button>
      <button class="chip ${mode === "read" ? "on" : ""}" data-m="read">📖 Study the solution</button>
    </div>
    <div id="work" style="margin-top:12px"></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><span class="meta">How did it go?</span>
      <button class="btn bad" id="r1">Shaky</button><button class="btn good" id="r2">Nailed it</button></div>
  </div>`;
  m.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; renderDrill(); });
  const step = k => { const v = visible().map(x => x[1]); const p = v.indexOf(cur); if (v.length) { cur = v[(p + k + v.length) % v.length]; renderList(); renderDrill(); } };
  document.getElementById("prev").onclick = () => step(-1);
  document.getElementById("nxt").onclick = () => step(1);
  document.getElementById("r1").onclick = () => { store.drill[cur] = 1; save(); renderList(); step(1); };
  document.getElementById("r2").onclick = () => { store.drill[cur] = 2; save(); renderList(); step(1); };
  const w = document.getElementById("work");
  const sol = `<h3>Model solution</h3><pre><code>${esc(lines.join("\n"))}</code></pre>${d.notes ? `<div class="fb info">${md(d.notes)}</div>` : ""}`;
  if (mode === "read") { w.innerHTML = sol; return; }
  if (mode === "write") {
    const key = "w" + cur;
    w.innerHTML = `<textarea id="ta" spellcheck="false" placeholder="Write the code here from memory, then press Compare…">${esc(store.ans[key] || "")}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="cmp">Compare with solution</button><button class="btn ghost" id="clr">Clear</button></div><div id="cmpout"></div>`;
    const ta = document.getElementById("ta");
    ta.addEventListener("keydown", e => { if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 4; } });
    ta.oninput = () => { store.ans[key] = ta.value; save(); };
    document.getElementById("clr").onclick = () => { ta.value = ""; store.ans[key] = ""; save(); };
    document.getElementById("cmp").onclick = () => {
      const mine = new Set(ta.value.split("\n").map(squash).filter(Boolean));
      const real = lines.map(squash).filter(x => x.length > 2);
      const hit = real.filter(x => mine.has(x)).length;
      document.getElementById("cmpout").innerHTML = `<div class="cols" style="margin-top:10px"><div><h3>Yours</h3><pre><code>${esc(ta.value || "(empty)")}</code></pre></div><div>${sol}</div></div>
        <div class="fb info">Rough line match: <b>${hit}/${real.length}</b> lines identical (ignoring spaces and comments). Different but equivalent code is fine. Judge the logic, then rate yourself below.</div>`;
    };
    return;
  }
  const gaps = pickGaps(lines);
  w.innerHTML = `<div class="gap" id="gapbox">${lines.map((l, i) => gaps.has(i)
      ? `<div class="ln">${esc(l.match(/^\s*/)[0])}<input data-i="${i}" spellcheck="false" autocomplete="off"></div>`
      : `<div class="ln">${esc(l) || " "}</div>`).join("")}</div>
    <div class="row" style="margin-top:8px"><button class="btn" id="chk">Check gaps</button><button class="btn ghost" id="newg">New gaps</button><button class="btn ghost" id="show">Reveal</button></div><div id="gapfb"></div>`;
  document.getElementById("newg").onclick = renderDrill;
  document.getElementById("chk").onclick = () => {
    let ok = 0, n = 0;
    w.querySelectorAll(".gap input").forEach(inp => { n++; const good = squash(inp.value) === squash(lines[+inp.dataset.i]); inp.className = good ? "ok" : "no"; if (good) ok++; });
    document.getElementById("gapfb").innerHTML = `<div class="fb ${ok === n ? "ok" : "no"}">${ok} / ${n} gaps exact. ${ok === n ? "Perfect." : "Red ones differ. They may still be equivalent, so press Reveal to compare."}</div>`;
  };
  document.getElementById("show").onclick = () => w.querySelectorAll(".gap input").forEach(inp => { if (inp.className !== "ok") { inp.value = lines[+inp.dataset.i].trim(); inp.className = "no"; } });
}
renderList(); renderDrill();

// ---------- papers ----------
function renderPaperSet(el, sets, prefix) {
  let which = 0, timerId = null, left = 0;
  function draw() {
    const P = sets[which];
    const total = P.qs.reduce((a, q) => a + q.m, 0);
    const got = P.qs.reduce((a, q, i) => a + (+store.marks[prefix + which + ":" + i] || 0), 0);
    let sec = null;
    el.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between">
        <div class="row">${sets.map((s, i) => `<button class="chip ${i === which ? "on" : ""}" data-p="${i}">${esc(s.name)}</button>`).join("")}</div>
        <div class="row"><span class="timer" id="tm"></span><button class="btn ghost" id="tbtn">${timerId ? "Stop timer" : "Start " + (P.mins || 180) + "-min timer"}</button></div></div>
        ${P.intro ? `<div style="margin-top:10px">${md(P.intro)}</div>` : ""}
        <div class="row" style="margin-top:10px"><span class="meta">Self-marked: <b>${got}</b> / ${total}</span>
        <button class="btn ghost" id="showall">Show all answers</button><button class="btn ghost" id="hideall">Hide all</button><button class="btn ghost" id="reset">Reset my marks</button></div></div>
      ${P.qs.map((q, i) => {
        const head = q.sec && q.sec !== sec ? `<div class="sec">${esc(sec = q.sec)}</div>` : "";
        const k = prefix + which + ":" + i;
        return head + `<div class="card q"><div class="head"><b>${esc(q.n)}</b><span class="marks">[${q.m}]</span></div>
          ${q.img ? `<div class="note">${md(q.img)}</div>` : ""}
          <div style="margin-top:6px">${md(q.q)}</div>
          <textarea class="short" data-k="${k}" spellcheck="false" placeholder="Your answer…">${esc(store.ans[k] || "")}</textarea>
          <div class="row" style="margin-top:8px"><button class="btn ghost" data-a="${i}">Show model answer</button>
          <span class="meta" style="margin-left:auto">My mark</span><input class="score" type="number" min="0" max="${q.m}" step="0.5" data-s="${k}" value="${store.marks[k] ?? ""}"><span class="meta">/ ${q.m}</span></div>
          <div class="ans hidden" id="a-${prefix}${i}">${md(q.a)}</div></div>`;
      }).join("")}`;
    el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { which = +b.dataset.p; draw(); });
    el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => document.getElementById("a-" + prefix + b.dataset.a).classList.toggle("hidden"));
    el.querySelectorAll("textarea[data-k]").forEach(t => t.oninput = () => { store.ans[t.dataset.k] = t.value; save(); });
    el.querySelectorAll("[data-s]").forEach(inp => inp.onchange = () => { store.marks[inp.dataset.s] = Math.min(+inp.max, Math.max(0, +inp.value || 0)); save(); draw(); });
    document.getElementById("showall").onclick = () => el.querySelectorAll(".ans").forEach(a => a.classList.remove("hidden"));
    document.getElementById("hideall").onclick = () => el.querySelectorAll(".ans").forEach(a => a.classList.add("hidden"));
    document.getElementById("reset").onclick = () => { if (confirm("Clear your marks and answers for this paper?")) { P.qs.forEach((q, i) => { delete store.marks[prefix + which + ":" + i]; delete store.ans[prefix + which + ":" + i]; }); save(); draw(); } };
    document.getElementById("tbtn").onclick = () => {
      if (timerId) { clearInterval(timerId); timerId = null; draw(); return; }
      left = (P.mins || 180) * 60;
      timerId = setInterval(() => { left--; const t = document.getElementById("tm"); if (t) t.textContent = `${Math.floor(left / 3600)}:${String(Math.floor(left / 60) % 60).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`; if (left <= 0) { clearInterval(timerId); timerId = null; alert("Time's up!"); } }, 1000);
      draw();
    };
  }
  draw();
}
renderPaperSet(document.getElementById("v-papers"), PAPERS, "p");
renderPaperSet(document.getElementById("v-predict"), PREDICTED, "x");
document.getElementById("v-about").innerHTML = `<div class="card">${md(ABOUT)}</div>`;
</script>
</body>
</html>
